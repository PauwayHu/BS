<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ch8 表單排版(JS)</title>
    <link rel="stylesheet" href="css/myallcss.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">

</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-12">
                <div class="display-3 text-bg-primary fw-900 text-center py-3">課程線上報名表</div>
            </div>
            <div class="col-12">
                <ul>1. Email: 包含@這個字元,使用include();8~15字</ul>
                <ul>2. 密碼: 8~16字</ul>
                <ul>3. 手機: 10個字;開頭為09-xxxxxxxx,使用starWith()</ul>
            </div>
        </div>

        <!-- <div class="row bg-light p-2">
            <div class="col-12">
                <div class="mb-3">
                    <label for="username" class="form-label">姓名</label>
                    <input type="text" class="form-control form-control-lg" id="username">
                </div>
            </div>
        </div> -->
        <div class="row p-2">
            <div class="col-12 bg-ligth">
                <div class="mb-3">
                    <label for="username" class="form-label">姓名</label>
                    <input type="text" class="form-control form-control-lg is-invalid" id="username" placeholder="姓名字串長度2~8!">
                    <div class="valid-feedback">符合規定</div>
                    <div class="invalid-feedback">不符合規定</div>
                </div>
            </div>
             <div class="col-12 mt-3">
                <button type="button" class="btn btn-primary" id="ok_btn">確認送出</button>
                <button type="reset" class="btn btn-secondary">重新填寫</button>
            </div>
        </div>
        
        <!-- 顯示輸入區塊 -->
         <div class="row">
            <div class="col-12">
                <div class="display-5 text-bg-success fw-900 text-center py-3 my-3">報名資料確認</div>
            </div>
            <div class="col-12" id="showmsg"></div>
         </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery.js"></script>
    <script>
        let flag_username = false; //布林值
        $(function(){
            //即時監聽 #username
            $("#username").on("input",function(){
                // console.log($("#username").val());
                console.log("input: " + $(this).val().length);
                if($(this).val().length > 1 && $(this).val().length < 9){
                    //符合規定
                    console.log("符合規定!");
                    $(this).removeClass("is-invalid");
                    $(this).addClass("is-valid");
                    flag_username = true;
                }else{
                    //不符合規定
                    console.log("不符合規定!");
                    $(this).removeClass("is-valid");
                    $(this).addClass("is-invalid");
                    flag_username = false;
                }
            });

            //輸入完成後離開欄位才觸發
            // $("#username").on("change", function(){
            //     console.log("change: " + $(this).val());
            // });


            //監聽#ok_btn確認送出
            $("#ok_btn").on("click", function(){
                if (flag_username == true){
                    console.log("符合規定!");
                    const strHTML = `<div class="h2">姓名: ${$("#username").val()}</div>`;
                    $("#showmsg").html(strHTML);
                }else{
                    console.log("不符合規定");
                    alert("不符合規定");
                }
            });
        });
    </script>
</body>
</html>

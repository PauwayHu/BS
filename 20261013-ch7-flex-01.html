<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ch7 flex - 時間軸(timeline)</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/myallCSS-TH.css">
    <style>
        .imgbox{
            height: 220px;
        }
        .timeline-section{
            position: relative;
        }
        .timeline-section::before{
            position: absolute;
            content: "";
            width: 5px;
            /* 要下背景色不然看不到 */
            background-color: rgba(31, 196, 196, 0.3);
            top: 0;
            bottom: 0;
            /* 移動中間 */
            left: 50%;
            /* 拉回來 translateX-水平 */
            transform: translateX(-50%);
        }
        .timeline-section-pointer{
            position: relative;
        }
        .timeline-section-pointer::before{
            position: absolute;
            content: "";
            /* 畫圓形 */
            width: 28px;
            height: 28px;
            /* 弄中空 */
            background-color: rgba(235, 243, 243, 0.8);
            border-radius: 50%;
            border: 8px solid rgba(31, 196, 196, 0.3);
            left: 50%;
            transform: translateX(-50%);
            top: 0;
        }

        @media screen and (max-width: 768px){
            /* 縮小時時間軸消失 */
            /* .timeline-section::before, .timeline-section-pointer::before{
                display: none;
            } */

            /* 縮小時移到左邊 */
            .timeline-section::before{
                left: -20px;
            }
            .timeline-section-pointer::before{
                left: -10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="display-2 text-center fw-900 my-4">時間軸(timeline)</div>
        <div class="timeline-section">
            <div class="row mt-3 align-items-center timeline-section-pointer">
                <div class="col-md-6">
                    <div class="imgbox bg-img roller-t" style="background-image: url(images/building01.avif);">
                        <div class="rollerbox-t">
                            <button class="btn btn-warning"></button>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="h2 fw-900 text-center">01標題</div>
                    <p>xxx: xxxxx</p>
                    <p>xxx: xxxx</p>
                    <p>xxxxxxxxxx</p>
                </div>
            </div>
            <div class="row mt-3 flex-row-reverse align-items-center timeline-section-pointer">
                <div class="col-md-6">
                    <div class="imgbox" style="background-image: url(images/building04.avif);"></div>
                </div>
                <div class="col-md-6">
                    <div class="h2 fw-900 text-center">02標題</div>
                    <p>時視頻飯店部落格，事實真正，特色知。</p>
                    <p>安全數字的話年代，一道大小通用工商加大人類近年來導致幻想。</p>
                </div>
            </div>
            <div class="row mt-3 timeline-section-pointer">
                <div class="col-md-6">
                    <div class="imgbox" style="background-image: url(images/building03.avif);"></div>
                </div>
                <div class="col-md-6">
                    <div class="h2 fw-900 text-center">03標題</div>
                    <p>時候僅僅，每天證實人類，生存一體，每月傳說別的本報合適白色視頻飯店部落格，事實真正，特色知。</p>
                    <p>安全市場價時間，發出本網站精靈他的，很快中間恐怖，規範動力，幻想。</p>
                </div>
            </div>
            <div class="row flex-row-reverse timeline-section-pointer">
                <div class="col-md-6">
                    <div class="imgbox" style="background-image: url(images/buliding02.avif);"></div>
                </div>
                <div class="col-md-6">
                    <div class="h2 fw-900 text-center">04標題</div>
                    <p>時候電一體，每月傳說別的本報合適白色視頻飯店部落格，事實真正，特色知。</p>
                    <p>安全數字的話年代，一道大小通用工商加大人類近年來導致地址，幻想。</p>
                </div>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>

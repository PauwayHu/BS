                name: (item.name ?? "").trim(),

                tel: (item.tel ?? "").trim(),

        console.log("清洗後的資料: ", cleanshops);


        //資料清楚的自訂函式(副程式)
        function normalize(data) {
            return data.map(function (item) {
                return {
                    name: (item.name ?? "未提供").trim(),
                    city: (item.city ?? "未提供").trim(),
                    tel: (item.tel ?? "未提供").trim(),
                    owner: (item.owner ?? "未提供").trim(),
                    address: (item.address ?? "未提供").trim(),
                }
            });
        }
        
        console.log("使用自訂函式(副程式)執行資料清洗: ", normalize(shops));

        //搜尋 filter
        const result = shops.filter(function (item){
            return item.city === "新北市"
        });
        console.log("用原本的資料搜尋結果: ", result);

        const resultCleanData = normalize(shops).filter(function (item){
            return item.name.includes("漢堡") && item.city === "新北市"
        });
        console.log("清洗後的資料搜尋結果: ", resultCleanData);

        // 1. 清洗資料(副程式)：針對 TravelFood.js 的 food 陣列進行清洗
        function normalizeFood(data) {
            return data.map(function (item) {
                return {
                    Name: (item.Name ?? "未提供").trim(),             // 清洗餐廳名稱
                    City: (item.City ?? "未提供").trim(),             // 清洗縣市
                    Town: (item.Town ?? "未提供").trim(),             // 清洗鄉鎮
                    Tel: (item.Tel ?? "未提供").trim(),               // 清洗電話
                    Address: (item.Address ?? "未提供").trim(),       // 清洗地址
                    FoodFeature: (item.FoodFeature ?? "").trim()     // 清洗特色介紹[cite: 1]
                }
            });
        }

        // 2. 篩選出新北市有介紹(FoodFeature)包含"美食"的店家
        const targetFoodResult = normalizeFood(food).filter(function (item) {
            // 條件一：縣市必須是"新北市"
            // 條件二：FoodFeature 內容必須包含"美食"字串[cite: 1]
            return item.City === "新北市" && item.FoodFeature.includes("美食");
        });

        console.log("新北市且介紹包含「美食」的店家: ", targetFoodResult);

        //分頁
        //將分頁的思考邏輯轉換成演算法在寫成程式碼
        //0 1 2 3 4 5 6 7
        const pageSize = 3; // 一頁有幾筆
        const page = 1; // 目前頁碼

        const start = (page - 1) * pageSize;
        const end = start + pageSize;
        const pageData = shops.slice(start, end)
        console.log("原始資料: ", shops);
        console.log("分頁資料: ", pageData);

        //使用travelfood資料練習分頁的邏輯
        //1.清洗 => 篩選 => 分頁
        // --- 使用 travelfood 資料練習分頁的邏輯 ---

        // 1. 清洗資料：使用我們剛才寫好的 normalizeFood 函式
        const cleanFood = normalizeFood(food);
        // 清洗
        console.log("清洗後的資料: ", cleanFood);
        // 2. 篩選 臺中市的介紹內容包含[美食]的店家
        // 2. 篩選資料：為了讓分頁效果明顯，我們改篩選「臺南市」的店家 (資料數較多)
        const filteredFood = cleanFood.filter(function (item) {
            return item.city === "臺南市" && item.remark.includes("美食"); // 提取縣市進行比對[cite: 1]
        });

        console.log("篩選後資料: ", filteredFood);
        console.log("符合條件的總比數: ",filteredFood.length);
        // 3. 分頁邏輯
        const foodPageSize = 4; // 設定每頁顯示 4 筆資料
        let foodPage = 1;       // 設定目前要看第 1 頁

        // 計算陣列的起訖索引值 (index)
        const foodStart = (foodPage - 1) * foodPageSize;
        const foodEnd = foodStart + foodPageSize;
        
        // 使用 slice() 擷取該頁的資料
        const foodPageData = filteredFood.slice(foodStart, foodEnd);

        // 輸出結果
        console.log("第" + foodPage + "頁的結果: ", foodPageData);
        
        // 你可以試著將 foodPage 改成 2，再次觀察 foodPageData 取出的結果
        // 將分頁整理成 副程式
        function pagination(data, pageSize, page){
            const start = (page - 1) * pageSize;
            const end = start + pageSize;

            return data.slice(start, end);
        }

    <script>
        $(function(){
            //介接資料
            $.ajax({
                type: "GET",
                url: "http://localhost:3000/travelfood",
                dataType: "json",
                success: showdata,
                error: function(){
                    console.log("介接失敗");
                    alert("介接失敗");
                }
            });
        });

        function showdata(data){
            console.log(data);
            $("#travelfood-list").empty();
            data.forEach(function(item){
                const strHTML = `<div class="col-md-6 col-lg-4   mt-3">
                <div class="box03">
                    <img src="images/building01.avif" class="img-fluid" alt="">
                    <div class="h4 fw-900 text-center mt-3">${item.Name}</div>
                    <div class="h3">地址: ${item.City}${item.Town}${item.Address}</div>
                    <div class="h3">電話: ${item.Tel}</div>
                    <div class="h3">簡介: ${item.HostWords}</div>
                </div>
            </div>`;
                $("#travelfood-list").append(strHTML);
            });
        }

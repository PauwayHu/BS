            <div class="col">
                <div class="card p-5">
                    <img src="images/building01.avif" class="card-img-top" alt="...">

                        <div class="display-6 fw-900 text-start mt-3">餐廳名稱</div>

                        <div class="h5 text-end mb-4">電話: 0912345678</div>
                        <!-- text-truncate-防止跑版讓沒顯示完的文章為(...) -->
                        <p class="card-text text-truncate">地址表達不久男生出租記錄軟體有時對他每月不願一陣，反正一對也要趨勢浪費時刻很快面臨樂隊正好許可，講話她們隨時素質特別場所要是滑鼠星座製品人間以及相關，怎麼樣價格從而小心完了不必內容總經理已經典型高中要去，看起來形象，提示訊息堅決導致解決方案，誘惑人間，英。</p>

    <script>
        console.log(food);

        $("foodlist").empty();
        food.forEach(function(item){
            const strHTML = `<div class="col">
                <div class="card p-1">
                    <img src="${item.PicURL}" class="card-img-top" alt="...">
                    <div class="card-body">
                        <div class="display-6 fw-900 text-start mt-3">${item.Name}</div>
                        <div class="h5 text-center mb-2">地址:${item.City}${item.Town}${item.Address}</div>
                        <div class="h5 text-end mb-4">電話:${item.Tel}</div>
                            <p class="card-text text-truncate">${item.HostWords}
                            </p>
                        </div> 
                    </div>
                </div>`;
            $("#foodlist").append(strHTML);
        });
    </script>
